# Baut RLTracker-Setup.exe automatisch auf einem Windows-Server von GitHub.
#
# Neue Version veroeffentlichen (alles im Browser):
#   GitHub -> dein Projekt -> "Releases" -> "Draft a new release"
#   -> Tag z.B. v1.1.0 eintippen ("Create new tag") -> Titel + Aenderungen eintragen -> "Publish release"
# Dieser Workflow baut dann die App mit genau dieser Versionsnummer und haengt RLTracker-Setup.exe
# an das Release. Die Webseite und die App erkennen die neue Version danach von selbst.
name: Installer bauen

on:
  release:
    types: [published]
  workflow_dispatch:   # manuell starten (Actions -> Installer bauen -> Run workflow) = Testbuild ohne Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer setzen
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $v = python installer/prepare_version.py $tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Baue Version $v"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib numpy subtr-actor-py pyinstaller

      - name: App bauen
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name RLTracker --icon icon.ico
          --version-file installer/version_info.generated.txt --collect-all subtr_actor --hidden-import mpl_toolkits.mplot3d
          --exclude-module tkinter main.py

      - name: Lizenzen sammeln
        run: python installer/collect_licenses.py dist/RLTracker/licenses

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installer bauen
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\setup.iss'

      - name: Pruefsumme berechnen
        shell: pwsh
        run: |
          $h = (Get-FileHash Output\RLTracker-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RLTracker-Setup.exe" | Out-File -Encoding ascii Output\RLTracker-Setup.exe.sha256
          Write-Host "SHA-256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: RLTracker-Setup-${{ env.VERSION }}
          path: Output/*

      - name: An das Release anhaengen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            Output/RLTracker-Setup.exe
            Output/RLTracker-Setup.exe.sha256
